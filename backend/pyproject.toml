[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-backend"
version = "0.1.0"
description = "Relay - AI order recovery agent (backend + simulated services)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# Optional persistent vector service. The app always has a database-vector fallback,
# so this extra is only needed when CHROMA_URL points at a running Chroma server.
rag = ["chromadb>=0.5.23,<0.6"]

[tool.setuptools.packages.find]
include = ["relay*", "sim_services*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
